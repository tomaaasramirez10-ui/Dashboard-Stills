<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1c1f2b;--mut:#6b7280;--red:#e41e2b;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#b3121d,#e41e2b 60%,#ff5a4d);color:#fff;padding:22px 32px}
header h1{margin:0;font-size:26px;letter-spacing:.3px}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
nav{display:flex;gap:6px;padding:14px 32px 0;flex-wrap:wrap}
nav button{border:0;background:#e9eaf0;padding:10px 20px;border-radius:10px 10px 0 0;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{background:var(--card);color:var(--red);box-shadow:0 -2px 0 var(--red) inset}
main{background:var(--card);margin:0 32px 32px;border-radius:0 12px 12px 12px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.pills button{border:1px solid var(--line);background:#fff;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:0.2s}
.pills button.on{background:var(--red);border-color:var(--red);color:#fff}
.pills button:hover:not(.on){border-color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.02)}
.kpi small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:0.5px}
.kpi b{display:block;font-size:26px;margin-top:4px;font-weight:800}
.kpi span{font-size:12px;font-weight:600}
.up{color:#0f9d58}.dn{color:#d93025}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;min-width:100px;transition:.15s;font-family:inherit;color:var(--ink)}
.chip b{display:block;font-size:13px}
.chip small{color:var(--mut);font-size:11px}
.chip:hover{border-color:var(--mut)}
.chip.on{color:#fff}
.chip.on small{color:rgba(255,255,255,.85)}
.chartbox{border:1px solid var(--line);border-radius:12px;padding:14px;height:430px;margin-bottom:25px;box-shadow:0 2px 5px rgba(0,0,0,0.02)}
h3{margin:0 0 6px;font-size:16px;font-weight:700}
.hint{color:var(--mut);font-size:13px;margin-bottom:12px}
.wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#1c1f2b;color:#fff;z-index:2;font-weight:600}
.s1,.s2{position:sticky;background:#fff;text-align:left;z-index:1}
.s1{left:0;min-width:120px;font-weight:700;color:var(--ink)}
.s2{left:120px;min-width:70px;border-right:2px solid var(--line)}
thead .s1,thead .s2{background:#1c1f2b;z-index:3;color:#fff}
tr.fmt{transition:0.1s}
tr.fmt:hover td,tr.fmt:hover .s2{background-color:#f9fafb}
tr.tot td, tr.tot .s1, tr.tot .s2 {background:#fde8ea;font-weight:700;color:var(--red)}
</style>
</head>

"Multicategoría":{"DN":[["Powerade 1.1 LTR",[65,62,62,62,67,66,66,63,63,70,68,71,70,73,72,70,69,69,69,66,67]],["Fastlyte 625 ML",[13,18,19,16,18,16,16,15,15,12,14,16,11,14,14,17,12,13,16,14,12]],["Monster 473 ML",[85,82,78,80,83,86,83,84,86,83,87,84,84,87,84,87,86,80,80,80,82]],["Del Valle 340 ML",[11,19,19,27,25,26,26,27,25,29,31,26,21,20,19,27,27,29,26,32,29]],["Guallarauco 1 LTR",[30,30,34,34,33,32,32,31,31,31,32,32,31,30,25,26,23,23,25,26,25]],["Kapo 252 ML",[27,28,32,33,38,36,35,33,33,35,35,35,36,36,37,34,29,29,31,31,32]],["Vital 600 ML",[66,67,64,62,58,56,54,61,57,62,58,60,64,63,66,61,57,56,54,56,56]],["Benedictino 500 ML",[33,30,33,31,30,31,30,34,36,37,37,44,44,42,38,37,35,31,30,26,36]]],"DP":[["Powerade 1.1 LTR",[72,73,77,78,79,78,77,73,76,78,77,79,78,81,83,81,81,82,82,82,79]],["Fastlyte 625 ML",[13,21,23,19,26,23,23,15,15,14,18,22,18,19,18,21,18,19,23,22,18]],["Monster 473 ML",[93,91,90,91,92,93,91,89,92,90,94,94,95,96,95,94,93,91,90,91,91]],["Del Valle 340 ML",[14,30,40,32,31,33,35,38,30,34,37,33,22,26,23,30,33,34,35,37,37]],["Guallarauco 1 LTR",[46,48,53,51,50,50,49,48,45,44,48,47,47,46,42,41,39,37,40,37,39]],["Kapo 252 ML",[34,33,40,42,47,43,35,34,34,37,39,40,42,41,40,39,32,36,37,36,34]],["Vital 600 ML",[69,72,73,71,66,63,63,70,62,68,67,70,73,71,71,69,67,69,65,65,66]],["Benedictino 500 ML",[44,45,46,44,44,43,41,39,44,46,47,53,55,50,46,44,47,43,39,37,47]]]}};
 
const ZONAS=Object.keys(D);
const PAL=['#e41e2b','#2563eb','#0f9d58','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#64748b'];
 
let mode = 'COB'; 
let curZone = ZONAS[0];
let sel = new Set();
let chart = null;
 
const fmtVal = (v, m) => v==null ? '–' : (m==='COB' ? (v*100).toFixed(1)+'%' : v+'%');
const heatVal = (v, max, m) => {
    if(v==null) return '';
    let pct = m==='COB' ? (v/max)*0.6 : (v/100)*0.6; 
    return `background:rgba(228,30,43,${pct.toFixed(2)})`;
};
const del = (a, b) => {
    if(a==null||b==null) return '<td style="color:var(--mut)">-</td>';
    const diff = (a - b).toFixed(1);
    return `<td style="color:${diff>0?'#0f9d58':diff<0?'#d93025':'#6b7280'};font-weight:700">${diff>0?'+':''}${diff} pp</td>`;
};
 
const navBtns = document.querySelectorAll('#mainTabs button');
const pillsDiv = document.getElementById('zonePills');
const kpisDiv = document.getElementById('kpis');
const chipsDiv = document.getElementById('chips');
const tbl = document.getElementById('tbl');
const title = document.getElementById('tableTitle');
const hint = document.getElementById('tableHint');
const subDesc = document.getElementById('subDesc');
 
function init() {
    pillsDiv.innerHTML = ZONAS.map(z => `<button class="${z===curZone?'on':''}" onclick="setZone('${z}')">${z}</button>`).join('');
    render();
}
 
function setMode(m) {
    mode = m;
    navBtns.forEach(b => b.classList.remove('on'));
    event.target.classList.add('on');
    sel = new Set();
    
    if(m==='COB') subDesc.textContent = "¡Hola Equipo! Seleccionen una pestaña para revisar Coberturas NARTD, Distribución Numérica (DN) o Distribución Ponderada (DP).";
    else subDesc.textContent = `Visualizando: ${m==='DN'?'Distribución Numérica':'Distribución Ponderada'} (Valores en %). Datos hasta 2026-09. Punta Arenas S/D.`;
    
    render()
}
 
function setZone(z) {
    curZone = z;
    Array.from(pillsDiv.children).forEach(b => b.classList.toggle('on', b.textContent === z));
    sel = new Set();
    render();
}
 
function parseCob() {
    const d = D[curZone];
    if(!d) return [];
    return d.rows.map(s => {
        const [b, f, st, v] = s.split('|');
        const a = Array(d.m.length).fill(null);
        v.split(' ').forEach((x, i) => { const k = +st + i; if (k < d.m.length) a[k] = +x; });
        return { b, f, raw: a, val: a.map((x, i) => x == null ? null : x / d.tot[i]) };
    });
}
 
function parseKpi() {
    const kData = K[curZone];
    if(!kData || !kData[mode]) return [];
    return kData[mode].map(item => {
        const parts = item[0].split(' ');
        const f = parts.slice(-2).join(' ');
        const b = parts.slice(0, -2).join(' ');
        return { b, f, val: item[1] };
    });
}
 
// Plugin: etiqueta de dato sobre cada punto
const labelPlugin = {
    id: 'puntoLabels',
    afterDatasetsDraw(c) {
        const x = c.ctx;
        const isCob = mode === 'COB';
        x.save();
        x.font = 'bold 10px Segoe UI, sans-serif';
        x.textAlign = 'center';
        c.data.datasets.forEach((d, i) => {
            const below = d.lblPos === 'below';
            x.textBaseline = below ? 'top' : 'bottom';
            x.fillStyle = d.borderColor;
            c.getDatasetMeta(i).data.forEach((p, k) => {
                const v = d.data[k];
                if(v == null) return;
                x.fillText(isCob ? v.toFixed(1) + '%' : v + '%', p.x, below ? p.y + 7 : p.y - 7);
            });
        });
        x.restore();
    }
};
 
function render() {
    if(mode !== 'COB' && curZone === 'Punta Arenas') {
        kpisDiv.innerHTML = `<div class="kpi" style="border-color:#d93025;color:#d93025"><b>Sin Datos</b><span>Punta Arenas no cuenta con matriz de ${mode}</span></div>`;
        tbl.innerHTML = '';
        chipsDiv.innerHTML = '';
        if(chart) chart.destroy();
        title.textContent = `Sin datos de ${mode} para Punta Arenas`;
        return;
    }
 
    const isCob = mode === 'COB';
    const rows = isCob ? parseCob() : parseKpi();
    const meses = isCob ? D[curZone].m : MESES_DN_DP;
    const n = meses.length;
    const L = n - 1; 
    const P = L - 1;
    const Y = L - 12;
 
    title.textContent = `${isCob ? 'Cob/NARTD' : (mode==='DN'?'Distribución Numérica':'Distribución Ponderada')} por marca y formato – ${curZone}`;
 
    const ord = [...rows].filter(r => r.val[L] != null).sort((a,b) => b.val[L] - a.val[L]);
    const max = isCob ? Math.max(...rows.flatMap(r => r.val.filter(x => x != null))) : 100;
    
    if(ord.length > 0) {
        const mv = [...ord].filter(r => r.val[P] != null).map(r => ({ r, d: (r.val[L] - r.val[P]) * (isCob?100:1) })).sort((a,b) => b.d - a.d);
        
        let k = [
            ['Mes de análisis', meses[L]],
            [`Mayor ${mode}`, fmtVal(ord[0].val[L], mode), `${ord[0].b} ${ord[0].f}`],
            [`Menor ${mode}`, fmtVal(ord.at(-1).val[L], mode), `${ord.at(-1).b} ${ord.at(-1).f}`]
        ];
        
        if(mv.length) {
            k.push(['Mayor alza mensual', `+${mv[0].d.toFixed(1)} pp`, `${mv[0].r.b} ${mv[0].r.f}`, 'up']);
            k.push(['Mayor baja mensual', `${mv.at(-1).d.toFixed(1)} pp`, `${mv.at(-1).r.b} ${mv.at(-1).r.f}`, 'dn']);
        }
        kpisDiv.innerHTML = k.map(x => `<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b><span class="${x[3]||''}">${x[2]||''}</span></div>`).join('');
    }
 
    let thH = `<thead><tr><th class="s1">Marca</th><th class="s2">Formato</th>${meses.map(m=>`<th>${m}</th>`).join('')}`;
    thH += `<th>Δ mes</th><th>Δ año</th>`;
    thH += `</tr></thead><tbody>`;
    let last = '';
    
    rows.forEach((r, i) => {
        const valL = isCob ? (r.val[L]!=null?r.val[L]*100:null) : r.val[L];
        const valP = isCob ? (r.val[P]!=null?r.val[P]*100:null) : r.val[P];
        const valY = isCob ? (r.val[Y]!=null?r.val[Y]*100:null) : r.val[Y];
        
        thH += `<tr class="fmt" data-i="${i}">
            <td class="s1">${r.b===last?'':r.b}</td><td class="s2">${r.f}</td>
            ${r.val.map(v => `<td style="${heatVal(v, max, mode)}">${fmtVal(v, mode)}</td>`).join('')}`;
            
        thH += `${del(valL, valP)}${del(valL, valY)}`;
        thH += `</tr>`;
        last = r.b;
    });
    
    if(isCob) {
        const tot = D[curZone].tot;
        thH += `<tr class="tot"><td class="s1">Total general</td><td class="s2">clientes</td>${tot.map(x=>`<td>${x.toLocaleString('es-CL')}</td>`).join('')}<td></td><td></td></tr>`;
    }
    
    tbl.innerHTML = thH + '</tbody>';
 
    // Selección inicial: el producto con mayor valor del último mes (hasta que el usuario toque una tarjeta)
    if(!sel.size && !sel.touched && ord.length > 0) {
        sel.add(rows.indexOf(ord[0]));
    }

    // Tarjetas de selección (una por marca + formato). Se muestra un producto a la vez: 2025 vs 2026
    chipsDiv.innerHTML = rows.map((r, i) => {
        const on = sel.has(i);
        const st = on ? `background:${PAL[0]};border-color:${PAL[0]}` : '';
        return `<button class="chip ${on?'on':''}" style="${st}" data-i="${i}"><b>${r.b}</b><small>${r.f}</small></button>`;
    }).join('');
    chipsDiv.querySelectorAll('.chip').forEach(c => {
        c.onclick = () => {
            sel = new Set([+c.dataset.i]);
            sel.touched = true;
            render();
        };
    });

    // Una línea por año (eje X = Ene a Dic)
    const MN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const YC = { '2025': '#2563eb', '2026': '#e41e2b' };
    const i0 = [...sel][0];
    const byYear = {};
    if(i0 != null && rows[i0]) {
        meses.forEach((lab, k) => {
            const v = rows[i0].val[k];
            const yr = lab.slice(0, 4), mo = +lab.slice(5, 7) - 1;
            if(!byYear[yr]) byYear[yr] = Array(12).fill(null);
            byYear[yr][mo] = v == null ? null : (isCob ? +(v*100).toFixed(2) : v);
        });
    }
    const ds = Object.keys(byYear).sort().filter(y => byYear[y].some(x => x != null)).map(y => ({
        label: y,
        data: byYear[y],
        borderColor: YC[y] || '#64748b',
        backgroundColor: YC[y] || '#64748b',
        tension: 0.3,
        pointRadius: 3,
        spanGaps: false,
        lblPos: y === '2025' ? 'below' : 'above'
    }));
    const prodName = i0 != null && rows[i0] ? `${rows[i0].b} ${rows[i0].f}` : '';
 
    // Zoom: el eje Y se ajusta al rango de lo seleccionado
    const all = ds.flatMap(d => d.data.filter(x => x != null));
    let yMin, yMax;
    if(all.length) {
        const lo = Math.min(...all), hi = Math.max(...all);
        const pad = Math.max((hi - lo) * 0.18, 1.5);
        yMin = Math.max(0, Math.floor(lo - pad));
        yMax = Math.ceil(hi + pad);
    }
 
    if(chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: { labels: MN, datasets: ds },
        plugins: [labelPlugin],
        options: {
            maintainAspectRatio: false,
            layout: { padding: { top: 20, bottom: 10 } },
            plugins: {
                title: { display: true, text: `Evolución ${mode} (%) 2025 vs 2026 – ${prodName} – ${curZone}` },
                tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y}%` } }
            },
            scales: { y: { min: yMin, max: yMax, ticks: { callback: v => v+'%' } } }
        }
    });
}
 
init();
</script>
